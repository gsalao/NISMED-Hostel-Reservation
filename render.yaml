# Render Blueprint: deploys the Django backend + a free PostgreSQL database.
# Docs: https://render.com/docs/blueprint-spec
databases:
  - name: nismed-hostel-db
    plan: free
    databaseName: nismed_hostel
    user: nismed

services:
  - type: web
    name: nismed-hostel-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn backend.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DB_NAME
        fromDatabase:
          name: nismed-hostel-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: nismed-hostel-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: nismed-hostel-db
          property: password
      - key: DB_HOST
        fromDatabase:
          name: nismed-hostel-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: nismed-hostel-db
          property: port
      # Optional services — leave blank to run without them.
      # REDIS_URL empty -> in-process cache; SUPABASE_* empty -> media images disabled.
      - key: REDIS_URL
        value: ""
      - key: SUPABASE_ACCESS_KEY
        value: ""
      - key: SUPABASE_SECRET_ACCESS_KEY
        value: ""
      - key: SUPABASE_PROJECT_ID
        value: ""
      - key: SUPABASE_ENDPOINT_URL
        value: ""
      - key: SUPABASE_REGION
        value: ""
      # Update these three after the Netlify frontend is live.
      - key: CORS_ALLOWED_ORIGINS
        value: "https://nismed-hostel.netlify.app"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://nismed-hostel.netlify.app"
      - key: FRONTEND_URL
        value: "https://nismed-hostel.netlify.app"
      # Email is sent through a Google Apps Script webapp (see backend/Code.gs).
      # Leave blank to skip emails; reservations still work.
      - key: GOOGLE_SCRIPT_URL
        value: ""
      - key: EMAIL_HOST_USER
        value: ""
      # Admin account created on first build (password readable in the
      # service's Environment tab on the Render dashboard).
      - key: DJANGO_SUPERUSER_USERNAME
        value: admin
      - key: DJANGO_SUPERUSER_EMAIL
        value: salaogerard@gmail.com
      - key: DJANGO_SUPERUSER_PASSWORD
        generateValue: true
