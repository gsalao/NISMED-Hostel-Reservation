name: Keep backend awake

# Render's free tier spins a service down after 15 minutes without traffic.
# Pinging every 10 minutes keeps it warm so visitors never hit a cold start.
# Override the URL by setting a repository variable named BACKEND_PING_URL.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend
        env:
          PING_URL: ${{ vars.BACKEND_PING_URL || 'https://nismed-hostel-backend.onrender.com/ping/' }}
        run: |
          curl -fsS --max-time 60 --retry 3 --retry-delay 10 "$PING_URL"
